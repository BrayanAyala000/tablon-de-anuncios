{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-2">Iniciar sesión</h1>
        <p class="text-secondary mb-4">Accede al tablón de anuncios institucional.</p>
        <form method="post">
          <div class="mb-3"><label class="form-label" for="usuario">Usuario</label>
            <input class="form-control" id="usuario" name="usuario" required autocomplete="username"></div>
          <div class="mb-3"><label class="form-label" for="password">Contraseña</label>
            <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password"></div>
          <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
        <div class="alert alert-light border mt-4 mb-0 small">
          <!--
          <strong>Acceso inicial de demostración</strong><br>Usuario: <code>admin</code><br>Contraseña: <code>Admin123!</code>
          <br>Cambia la contraseña antes de usar el sistema en un entorno real.
          -->
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
