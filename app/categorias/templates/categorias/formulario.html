{% extends "base.html" %}{% block title %}Categoría{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><h1 class="h2 mb-4">{{ 'Editar categoría' if categoria else 'Nueva categoría' }}</h1>
<form method="post" class="card card-body border-0 shadow-sm"><div class="mb-3"><label class="form-label">Nombre *</label><input class="form-control" name="nombre" required value="{{ categoria.nombre if categoria else '' }}"></div><div class="mb-3"><label class="form-label">Descripción</label><textarea class="form-control" name="descripcion" rows="3">{{ categoria.descripcion if categoria else '' }}</textarea></div><div class="d-flex gap-2"><button class="btn btn-primary">Guardar</button><a class="btn btn-outline-secondary" href="{{ url_for('categorias.lista_categorias') }}">Cancelar</a></div></form></div></div>{% endblock %}
