{% extends "base.html" %}{% block title %}{{ 'Editar' if usuario else 'Nuevo' }} usuario{% endblock %}
{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><h1 class="h2 mb-4">{{ 'Editar usuario' if usuario else 'Crear usuario' }}</h1>
<form method="post" class="card card-body shadow-sm border-0">
<div class="mb-3"><label class="form-label">Nombre completo *</label><input class="form-control" name="nombre" required value="{{ usuario.nombre if usuario else '' }}"></div>
<div class="mb-3"><label class="form-label">Nombre de usuario *</label><input class="form-control" name="username" required value="{{ usuario.username if usuario else '' }}"></div>
<div class="mb-3"><label class="form-label">Correo electrónico *</label><input class="form-control" type="email" name="email" required value="{{ usuario.email if usuario else '' }}"></div>
<div class="mb-3"><label class="form-label">Contraseña {{ '(dejar vacía para conservar)' if usuario else '*' }}</label><input class="form-control" type="password" name="password" {{ '' if usuario else 'required' }} minlength="8"></div>
<div class="mb-3"><label class="form-label">Rol</label><select class="form-select" name="rol"><option value="usuario" {{ 'selected' if not usuario or usuario.rol=='usuario' else '' }}>Usuario</option><option value="admin" {{ 'selected' if usuario and usuario.rol=='admin' else '' }}>Administrador</option></select></div>
<div class="d-flex gap-2"><button class="btn btn-primary">Guardar</button><a class="btn btn-outline-secondary" href="{{ url_for('usuarios.lista_usuarios') }}">Cancelar</a></div>
</form></div></div>{% endblock %}
